name: node CI
on: push
env:
  API_URL: ${{ vars.API_URL }}
jobs:
  code-check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: dependency installation
        run: npm ci
      - name: check execution
        run: |
          npm run lint
          npm run test

